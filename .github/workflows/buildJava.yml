name: Java CI with Maven - Test and package
on: 
  pull_request: 
    branches:
      -main

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: clone repo
        uses: actions/checkout@v4

      - name: configurate java JDK 21 env 
        uses: actions/setup-java@v4
        with: 
          java-version: '21'
          distrubution: 'corretto'
          cache: maven 

      - name: compile and package
        run: mvn -B package